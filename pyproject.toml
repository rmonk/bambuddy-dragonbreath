[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bambuddy-dragonbreath"
version = "0.1.0"
description = "Drive a DragonBreath (Panda Breath) chamber heater from Bambuddy print events, using the filament Bambuddy knows the print uses."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
bambuddy-dragonbreath = "bambuddy_dragonbreath.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bambuddy_dragonbreath"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
